[package]
name = "gpui-ribbon"
description = "Ribbon UI for GPUI applications, built on gpui-base."
keywords = ["ribbon", "gpui", "ui", "desktop"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-ribbon"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit/tree/main/crates/ribbon"
edition.workspace = true
publish = true
version = "0.6.0"

[lib]
doctest = false

[dependencies]
gpui = { workspace = true }
gpui-base = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
